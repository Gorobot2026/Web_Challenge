<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO ROBOT CHALLENGE 2026 - WEDO & iDekTep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
 --bg:#0b1640;--panel:#132259;--panel2:#182a68;--line:rgba(255,255,255,.1);--text:#fff;--dim:#9fb0e0;
 --orange:#f47721;--pink:#e83a8e;--blue:#1ea3e8;--green:#3db54a;--yellow:#ffc20e;
 --gold:#ffc20e;--silver:#b9c4dc;--bronze:#d98a4e;--purple:#a56bff;
}
html,body{margin:0;min-height:100%}
body{font-family:'Prompt','Noto Sans Thai',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 36px}
.brand{display:flex;align-items:center;gap:22px}
.logo{height:112px;width:auto;display:block}
.topbar h1{margin:0;font-size:clamp(26px,3.6vw,52px);font-weight:800;line-height:1.05;letter-spacing:.5px}
.topbar p{margin:8px 0 0;font-size:16px;color:var(--dim)}
.right{display:flex;align-items:center;gap:16px;text-align:right}
.live{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;justify-content:flex-end}
.dot{width:10px;height:10px;border-radius:50%;background:#ff4d4d;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
#updateTime{display:block;font-size:13px;color:var(--dim);font-weight:400}
.fs{border:1px solid var(--line);background:transparent;color:#fff;width:42px;height:42px;border-radius:10px;font-size:18px;cursor:pointer}
.fs:hover{background:rgba(255,255,255,.1)}
.fs:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.stripe{height:7px;background:linear-gradient(90deg,var(--orange) 0 20%,var(--pink) 20% 40%,var(--blue) 40% 60%,var(--green) 60% 80%,var(--yellow) 80% 100%)}
.page{max-width:1800px;margin:0 auto;padding:28px 36px 44px}
.boards{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:28px;align-items:stretch}
.board{background:var(--panel);border-radius:16px;overflow:hidden}
.board-title{display:flex;align-items:center;gap:14px;padding:18px 22px;background:var(--panel2)}
.board-title:before{content:"";width:8px;height:34px;border-radius:4px;background:var(--c)}
.board-title h2{margin:0;font-size:30px;font-weight:800}
.board-title span{font-size:15px;color:var(--dim);margin-left:auto}
.idek{--c:var(--purple)}.wedo{--c:var(--yellow)}
.head,.team{display:grid;align-items:center}
.idek .head,.idek .team{grid-template-columns:72px 130px 330px 1fr 1fr}
.head{color:var(--dim);font-size:17px;font-weight:500;border-bottom:2px solid var(--c)}
.head>div{padding:10px 14px}
.head .r{text-align:right}
.head .c{text-align:center}
.head small{display:block;font-size:11px;font-weight:400;opacity:.7}
.team{min-height:84px;border-bottom:1px solid var(--line);border-left:6px solid transparent}
.team:last-child{border-bottom:none}
.team:nth-child(even){background:rgba(255,255,255,.03)}
.team>div{padding:8px 14px}
.team-name{font-size:30px;font-weight:700}
.member{font-size:30px;color:#cdd7f5}
.score{font-size:32px;font-weight:800;text-align:right}
.rank{display:flex}
.rank-badge{width:50px;height:50px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--dim);background:rgba(255,255,255,.07)}
.top-1{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(255,194,14,.18),transparent 75%)!important}
.top-2{border-left-color:var(--silver);background:linear-gradient(90deg,rgba(185,196,220,.14),transparent 75%)!important}
.top-3{border-left-color:var(--bronze);background:linear-gradient(90deg,rgba(217,138,78,.16),transparent 75%)!important}
.top-1 .rank-badge{background:var(--gold);color:#2a1d00}
.top-2 .rank-badge{background:var(--silver);color:#1a2340}
.top-3 .rank-badge{background:var(--bronze);color:#2a1500}
.top-1 .score{color:var(--gold)}
.loading{padding:40px;text-align:center;color:var(--dim);font-size:17px}

/* iDekTep: คะแนนและเวลาแต่ละรอบ + ไฮไลต์รอบที่ดีที่สุด */
.team>.rd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin:0 6px;padding:6px 4px;border-radius:10px;border:1px solid transparent;position:relative}
.rd .rs{font-size:38px;font-weight:800;line-height:1.1}
.rd .rt{font-size:22px;color:var(--dim)}
.team>.rd.best{background:rgba(165,107,255,.22);border-color:var(--purple)}
.rd.best .rt{color:#e3d4ff}
.rd.best:after{content:"★ ดีที่สุด";position:absolute;top:-7px;right:6px;font-size:10px;font-weight:700;background:var(--purple);color:#fff;border-radius:6px;padding:0 6px;line-height:16px}

/* WEDO: เล็กกว่า iDekTep เล็กน้อย และยืดให้เต็มความสูงเท่ากับตารางซ้าย */
.wedo{display:flex;flex-direction:column}
.wedo #wedoData{flex:1;display:flex;flex-direction:column}
.wedo .head{min-height:64px}
.wedo .head,.wedo .team{grid-template-columns:60px 92px minmax(120px,1fr) 100px}
.wedo .team{flex:1 1 0;min-height:78px;max-height:100px}
.wedo .team-name{font-size:26px}
.wedo .member{font-size:24px}
.wedo .score{font-size:32px}
.wedo .rank-badge{width:44px;height:44px;font-size:21px}

@media(max-width:1150px){.boards{grid-template-columns:1fr}}
@media(max-width:700px){
 .topbar{padding:12px 14px}.topbar p{display:none}.logo{height:58px}.brand{gap:12px}
 .page{padding:14px 10px 28px}.fs{display:none}
 .idek .head,.idek .team{grid-template-columns:40px 56px minmax(0,1fr) 64px 64px}
 .wedo .head,.wedo .team{grid-template-columns:40px 56px minmax(60px,1fr) 56px}
 .head{font-size:12px}.head>div,.team>div{padding:6px}
 .team{min-height:60px}.team-name{font-size:15px}.member{font-size:14px}.score{font-size:20px}
 .wedo .head{min-height:0}
 .wedo .team{min-height:60px;max-height:none;flex:none}
 .wedo .team-name{font-size:15px}
 .wedo .member{font-size:14px}
 .wedo .score{font-size:18px}
 .rank-badge,.wedo .rank-badge{width:32px;height:32px;font-size:15px;border-radius:8px}
 .board-title h2,.wedo .board-title h2{font-size:22px}
 .rd .rs{font-size:18px}.rd .rt{font-size:12px}
 .team>.rd{margin:0 2px;padding:4px 2px}
 .rd.best:after{content:"★";font-size:9px;padding:0 4px;right:2px}
}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <!-- วางโลโก้เดิมตรงนี้: เปลี่ยน src ให้เป็น data:image/png;base64,... ตัวเดิมจากไฟล์ของคุณ -->
    <img class="logo" src="LOGO_SRC_เดิม" alt="GO Robot - Robotics and Coding" onerror="this.style.display='none'">
    <div>
      <h1>GO ROBOT CHALLENGE 2026</h1>
      <p>ตารางคะแนนสด รุ่น WEDO และ iDekTep</p>
    </div>
  </div>
  <div class="right">
    <div class="live"><span class="dot"></span><span id="updateTime"></span></div>
    <button class="fs" onclick="toggleFullscreen()" title="เต็มจอ" aria-label="เต็มจอ">⛶</button>
  </div>
</header>
<div class="stripe"></div>

<div class="page">
  <main class="boards">
    <section class="board idek">
      <div class="board-title"><h2>iDekTep</h2><span>ตารางคะแนน</span></div>
      <div class="head">
        <div>อันดับ</div><div>ทีม</div><div>สมาชิก</div>
        <div class="c">รอบ 1<small>คะแนน / เวลา</small></div>
        <div class="c">รอบ 2<small>คะแนน / เวลา</small></div>
      </div>
      <div id="idektepData"><div class="loading">กำลังโหลดข้อมูล iDEKTEP...</div></div>
    </section>

    <section class="board wedo">
      <div class="board-title"><h2>WEDO</h2><span>ตารางคะแนน</span></div>
      <div class="head">
        <div>อันดับ</div><div>ทีม</div><div>สมาชิก</div><div class="r">คะแนน</div>
      </div>
      <div id="wedoData"><div class="loading">กำลังโหลดข้อมูล WEDO...</div></div>
    </section>
  </main>
</div>
<script>
const IDEKTEP_API_URL="https://script.google.com/macros/s/AKfycbwEKF6Pabk1pbEYdihWp1ouxwdCpoHjikhH4Q5F7AqFX4zharAWgB6_7JOME9H1KhDJIQ/exec";
const WEDO_API_URL="https://script.google.com/macros/s/AKfycbzLrGq-lSyBgOlyqXDPlSHn_m0iW4PAWVr-DaGfDKY9iIWPL2hbkNP2gYb4CkoU-ZFndw/exec";

const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:NaN};
const toSec=v=>{const p=String(v??'').split(':').map(parseFloat);return p.some(x=>!Number.isFinite(x))?Infinity:p.reduce((a,x)=>a*60+x,0)};
const cmp=(x,y)=>x===y?0:x-y;
const isHeaderRow=t=>!t||t==='TEAM'||t.includes('GO ROBOT')||t.includes('SCORE BOARD');

function escapeHtml(value){
 return String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

/* ---------- WEDO ---------- */
function cleanRows(raw){
 if(!Array.isArray(raw)) return [];
 return raw.map(row=>({
   team:row[1]?String(row[1]).trim():'',
   member:row[2]?String(row[2]).trim():'',
   score:row[4]?String(row[4]).trim():''
 })).filter(r=>!isHeaderRow(r.team));
}

function rankClass(rank){return rank<=3?`top-${rank}`:''}

function rowHtml(r,rank){
 return `<div class="team ${rankClass(rank)}"><div class="rank"><span class="rank-badge">${rank}</span></div><div class="team-name">${escapeHtml(r.team)||'-'}</div><div class="member">${escapeHtml(r.member)||'-'}</div><div class="score">${escapeHtml(r.score)||'-'}</div></div>`;
}

function renderWedo(raw){
 const board=document.getElementById('wedoData');
 const rows=cleanRows(raw);
 rows.sort((a,b)=>(num(b.score)||0)-(num(a.score)||0));
 board.innerHTML=rows.length?rows.map((r,i)=>rowHtml(r,i+1)).join(''):'<div class="loading">ไม่พบข้อมูล</div>';
}

/* ---------- iDekTep ---------- */
// คอลัมน์ใน Sheets: B=ทีม, C=สมาชิก, E/F=รอบ 1 (คะแนน/เวลา), G/H=รอบ 2 (คะแนน/เวลา)
function cleanIdektep(raw){
 if(!Array.isArray(raw)) return [];
 const s=v=>v!=null?String(v).trim():'';
 return raw.map(row=>({
   team:s(row[1]),member:s(row[2]),
   rounds:[{score:s(row[4]),time:s(row[5])},{score:s(row[6]),time:s(row[7])}]
 })).filter(r=>!isHeaderRow(r.team));
}

// รอบที่ดีที่สุด: คะแนนมากกว่าชนะ ถ้าเท่ากันดูเวลาที่น้อยกว่า
function bestRound(rounds){
 let best=-1;
 rounds.forEach((r,i)=>{
   const sc=num(r.score); if(Number.isNaN(sc)) return;
   if(best<0){best=i;return;}
   const b=rounds[best], bs=num(b.score);
   if(sc>bs||(sc===bs&&toSec(r.time)<toSec(b.time))) best=i;
 });
 return best;
}

function idekRowHtml(r,rank){
 const cells=r.rounds.map((x,i)=>`<div class="rd${i===r.best?' best':''}"><span class="rs">${escapeHtml(x.score)||'-'}</span><span class="rt">${escapeHtml(x.time)||'-'}</span></div>`).join('');
 return `<div class="team ${rankClass(rank)}"><div class="rank"><span class="rank-badge">${rank}</span></div><div class="team-name">${escapeHtml(r.team)||'-'}</div><div class="member">${escapeHtml(r.member)||'-'}</div>${cells}</div>`;
}

function renderIdektep(raw){
 const board=document.getElementById('idektepData');
 const rows=cleanIdektep(raw).map(r=>{
   const b=bestRound(r.rounds);
   return {...r,best:b,bs:b>=0?num(r.rounds[b].score):-Infinity,bt:b>=0?toSec(r.rounds[b].time):Infinity};
 });
 rows.sort((a,b)=>cmp(b.bs,a.bs)||cmp(a.bt,b.bt));
 board.innerHTML=rows.length?rows.map((r,i)=>idekRowHtml(r,i+1)).join(''):'<div class="loading">ไม่พบข้อมูล</div>';
}

/* ---------- โหลดข้อมูล ---------- */
async function fetchJson(url){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),10000);
 try{
   const res=await fetch(url,{cache:'no-store',signal:controller.signal});
   if(!res.ok) throw new Error(`HTTP ${res.status}`);
   const data=await res.json();
   if(!data.success) throw new Error(data.error||'API error');
   return data;
 }finally{
   clearTimeout(timeout);
 }
}

let isLoading=false;
let hasIdektepData=false;
let hasWedoData=false;

async function loadAll(){
 if(isLoading) return;
 isLoading=true;

 try{
   const results=await Promise.allSettled([
     fetchJson(IDEKTEP_API_URL),
     fetchJson(WEDO_API_URL)
   ]);

   if(results[0].status==='fulfilled'){
     renderIdektep(results[0].value.standings);
     hasIdektepData=true;
   }else{
     console.warn('iDEKTEP API ERROR:',results[0].reason);
     if(!hasIdektepData){
       document.getElementById('idektepData').innerHTML='<div class="loading">กำลังเชื่อมต่อ iDEKTEP...</div>';
     }
   }

   if(results[1].status==='fulfilled'){
     renderWedo(results[1].value.standings);
     hasWedoData=true;
   }else{
     console.warn('WEDO API ERROR:',results[1].reason);
     if(!hasWedoData){
       document.getElementById('wedoData').innerHTML='<div class="loading">กำลังเชื่อมต่อ WEDO...</div>';
     }
   }

   document.getElementById('updateTime').textContent='อัปเดต '+new Date().toLocaleTimeString('th-TH');
 }catch(error){
   console.error('LOAD ERROR:',error);
 }finally{
   isLoading=false;
   setTimeout(loadAll,5000);
 }
}

function toggleFullscreen(){
 if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(err=>alert(`ไม่สามารถเข้าสู่โหมดเต็มจอได้: ${err.message}`));}
 else if(document.exitFullscreen){document.exitFullscreen();}
}

loadAll();
</script>
</body>
</html>
