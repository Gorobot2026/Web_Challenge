<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO ROBOT CHALLENGE 2026 - WEDO & iDekTep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
 --page:#e9edf2;--ink:#14213d;--panel:#fff;--line:#dde3ea;--text:#1b2433;--dim:#6b788b;
 --idek:#3a5bd9;--wedo:#12907f;
 --gold:#d4a017;--silver:#8f9bab;--bronze:#b5733a;
}
html,body{margin:0;min-height:100%}
body{font-family:'Prompt','Noto Sans Thai',Tahoma,sans-serif;background:var(--page);color:var(--text);font-variant-numeric:tabular-nums}
.topbar{background:var(--ink);color:#fff;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:4px solid #f2b705}
.topbar h1{margin:0;font-size:clamp(22px,3vw,38px);font-weight:700;line-height:1.1}
.topbar p{margin:4px 0 0;font-size:15px;color:#aab6cc;font-weight:400}
.right{display:flex;align-items:center;gap:18px;text-align:right}
.live{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;background:#ff4d4d;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
#updateTime{font-size:13px;color:#aab6cc;display:block;font-weight:400}
.fs{border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;width:40px;height:40px;border-radius:6px;font-size:18px;cursor:pointer}
.fs:hover{background:rgba(255,255,255,.12)}
.fs:focus-visible{outline:2px solid #f2b705;outline-offset:2px}
.page{max-width:1800px;margin:0 auto;padding:26px 32px 40px}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.board{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(20,33,61,.08)}
.board-title{display:flex;align-items:baseline;gap:12px;padding:16px 22px;border-top:5px solid var(--c);border-bottom:1px solid var(--line)}
.board-title h2{margin:0;font-size:28px;font-weight:700;color:var(--c)}
.board-title span{font-size:15px;color:var(--dim)}
.idek{--c:var(--idek)}.wedo{--c:var(--wedo)}
.idek .head,.idek .team{grid-template-columns:76px minmax(150px,1.1fr) minmax(140px,1.1fr) 100px 100px}
.wedo .head,.wedo .team{grid-template-columns:76px minmax(150px,1.1fr) minmax(140px,1.1fr) 110px}
.head,.team{display:grid;align-items:center}
.head{background:#f4f6f9;color:var(--dim);font-size:15px;font-weight:500;border-bottom:1px solid var(--line)}
.head>div{padding:11px 14px}
.team{min-height:68px;border-bottom:1px solid var(--line);border-left:5px solid transparent}
.team:last-child{border-bottom:none}
.team>div{padding:8px 14px}
.team-name{font-size:22px;font-weight:600}
.member{font-size:20px;color:#3c4a5f}
.score{font-size:30px;font-weight:700;text-align:right}
.time{font-size:24px;color:var(--dim);text-align:right}
.head .r{text-align:right}
.rank{display:flex}
.rank-badge{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--dim);background:#eef1f5}
.top-1{border-left-color:var(--gold);background:#fdf6df}
.top-2{border-left-color:var(--silver);background:#f1f3f6}
.top-3{border-left-color:var(--bronze);background:#faf0e6}
.top-1 .rank-badge{background:var(--gold);color:#fff}
.top-2 .rank-badge{background:var(--silver);color:#fff}
.top-3 .rank-badge{background:var(--bronze);color:#fff}
.loading{padding:40px;text-align:center;color:var(--dim);font-size:17px}
@media(max-width:1150px){.boards{grid-template-columns:1fr}}
@media(max-width:700px){
 .topbar{padding:12px 14px}.topbar p{display:none}.page{padding:12px 10px 28px}
 .idek .head,.idek .team{grid-template-columns:50px minmax(80px,1fr) minmax(70px,1fr) 56px 62px}
 .wedo .head,.wedo .team{grid-template-columns:50px minmax(80px,1fr) minmax(70px,1fr) 64px}
 .head{font-size:12px}.head>div,.team>div{padding:6px}
 .team{min-height:60px}.team-name{font-size:15px}.member{font-size:14px}.score{font-size:20px}.time{font-size:15px}
 .rank-badge{width:32px;height:32px;font-size:15px}.board-title h2{font-size:22px}.fs{display:none}
}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<header class="topbar">
  <div>
    <h1>GO ROBOT CHALLENGE 2026</h1>
    <p>ตารางคะแนนสด รุ่น WEDO และ iDekTep</p>
  </div>
  <div class="right">
    <div class="live"><span class="dot"></span>คะแนนสด<span id="updateTime"></span></div>
    <button class="fs" onclick="toggleFullscreen()" title="เต็มจอ" aria-label="เต็มจอ">⛶</button>
  </div>
</header>

<div class="page">
  <main class="boards">
    <section class="board idek">
      <div class="board-title"><h2>iDekTep</h2><span>ตารางคะแนน</span></div>
      <div class="head">
        <div>อันดับ</div><div>ทีม</div><div>สมาชิก</div><div class="r">คะแนน</div><div class="r">เวลา</div>
      </div>
      <div id="idektepData"><div class="loading">กำลังโหลดข้อมูล iDEKTEP...</div></div>
    </section>

    <section class="board wedo">
      <div class="board-title"><h2>WEDO</h2><span>ตารางคะแนน</span></div>
      <div class="head">
        <div>อันดับ</div><div>ทีม</div><div>สมาชิก</div><div class="r">คะแนน</div>
      </div>
      <div id="wedoData"><div class="loading">กำลังโหลดข้อมูล WEDO...</div></div>
    </section>
  </main>
</div>
<script>
const IDEKTEP_API_URL="https://script.google.com/macros/s/AKfycbwEKF6Pabk1pbEYdihWp1ouxwdCpoHjikhH4Q5F7AqFX4zharAWgB6_7JOME9H1KhDJIQ/exec";
const WEDO_API_URL="https://script.google.com/macros/s/AKfycbzLrGq-lSyBgOlyqXDPlSHn_m0iW4PAWVr-DaGfDKY9iIWPL2hbkNP2gYb4CkoU-ZFndw/exec";

function cleanRows(raw,withTime){
 if(!Array.isArray(raw)) return [];
 return raw.map(row=>({
   team:row[1]?String(row[1]).trim():'',
   member:row[2]?String(row[2]).trim():'',
   score:row[4]?String(row[4]).trim():'',
   time:withTime&&row[5]?String(row[5]).trim():''
 })).filter(r=>r.team&&r.team!=='TEAM'&&!r.team.includes('GO ROBOT')&&!r.team.includes('SCORE BOARD'));
}

function rowHtml(r,rank,withTime){
 const top=rank<=3?`top-${rank}`:'';
 return `<div class="team ${top}"><div class="rank"><span class="rank-badge">${rank}</span></div><div class="team-name">${escapeHtml(r.team)||'-'}</div><div class="member">${escapeHtml(r.member)||'-'}</div><div class="score">${escapeHtml(r.score)||'-'}</div>${withTime?`<div class="time">${escapeHtml(r.time)||'-'}</div>`:''}</div>`;
}

function renderIdektep(raw){
 const board=document.getElementById('idektepData');
 const rows=cleanRows(raw,true);
 rows.sort((a,b)=>{
   const sa=parseFloat(a.score.replace(/,/g,''))||0, sb=parseFloat(b.score.replace(/,/g,''))||0;
   if(sb!==sa)return sb-sa;
   const ta=parseFloat(a.time); const tb=parseFloat(b.time);
   return (Number.isFinite(ta)?ta:Infinity)-(Number.isFinite(tb)?tb:Infinity);
 });
 board.innerHTML=rows.length?rows.map((r,i)=>rowHtml(r,i+1,true)).join(''):'<div class="loading">ไม่พบข้อมูล</div>';
}

function renderWedo(raw){
 const board=document.getElementById('wedoData');
 const rows=cleanRows(raw,false);
 rows.sort((a,b)=>(parseFloat(b.score.replace(/,/g,''))||0)-(parseFloat(a.score.replace(/,/g,''))||0));
 board.innerHTML=rows.length?rows.map((r,i)=>rowHtml(r,i+1,false)).join(''):'<div class="loading">ไม่พบข้อมูล</div>';
}

function escapeHtml(value){
 return String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

async function fetchJson(url){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),10000);
 try{
   const res=await fetch(url,{cache:'no-store',signal:controller.signal});
   if(!res.ok) throw new Error(`HTTP ${res.status}`);
   const data=await res.json();
   if(!data.success) throw new Error(data.error||'API error');
   return data;
 }finally{
   clearTimeout(timeout);
 }
}

let isLoading=false;
let hasIdektepData=false;
let hasWedoData=false;

async function loadAll(){
 if(isLoading) return;
 isLoading=true;

 try{
   const results=await Promise.allSettled([
     fetchJson(IDEKTEP_API_URL),
     fetchJson(WEDO_API_URL)
   ]);

   if(results[0].status==='fulfilled'){
     renderIdektep(results[0].value.standings);
     hasIdektepData=true;
   }else{
     console.warn('iDEKTEP API ERROR:',results[0].reason);
     if(!hasIdektepData){
       document.getElementById('idektepData').innerHTML='<div class="loading">กำลังเชื่อมต่อ iDEKTEP...</div>';
     }
   }

   if(results[1].status==='fulfilled'){
     renderWedo(results[1].value.standings);
     hasWedoData=true;
   }else{
     console.warn('WEDO API ERROR:',results[1].reason);
     if(!hasWedoData){
       document.getElementById('wedoData').innerHTML='<div class="loading">กำลังเชื่อมต่อ WEDO...</div>';
     }
   }

   document.getElementById('updateTime').textContent='อัปเดต '+new Date().toLocaleTimeString('th-TH');
 }catch(error){
   console.error('LOAD ERROR:',error);
 }finally{
   isLoading=false;
   setTimeout(loadAll,5000);
 }
}

function toggleFullscreen(){
 if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(err=>alert(`ไม่สามารถเข้าสู่โหมดเต็มจอได้: ${err.message}`));}
 else if(document.exitFullscreen){document.exitFullscreen();}
}

loadAll();
</script>
</body>
</html>
