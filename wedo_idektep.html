<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO ROBOT CHALLENGE 2026 - WEDO & iDekTep</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

:root{
 --bg:#080d21;
 --text:#f4f8ff;
 --dim:#8ea4c4;
 --neon:#2edcff;
 --neon2:#1e7bff;
 --violet:#b17dff;
 --gold:#ffc400;
 --gold1:#ffe27a;
 --gold2:#ff9d00;
 --silver:#c8d2dc;
 --bronze:#e97816;
 --best-green:#86efac;
}

html,body{margin:0;min-height:100%}

body{
 font-family:'Kanit',Tahoma,sans-serif;
 color:var(--text);
 font-variant-numeric:tabular-nums;
 min-height:100vh;
 background:
 radial-gradient(circle at 50% 38%,rgba(31,94,153,.22),transparent 42%),
 linear-gradient(135deg,#080d21 0%,#0c1430 48%,#111e3b 100%);
 background-attachment:fixed;
}

body:before{
 content:"";
 position:fixed;
 inset:0;
 pointer-events:none;
 z-index:0;
 background:
 linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
 background-size:42px 42px;
 mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 85%);
}

.topbar,.stripe,.page{position:relative;z-index:1}

/* HEADER */

.topbar{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:24px;
 padding:18px 36px;
}

.brand{display:flex;align-items:center;gap:22px}

.logo{
 height:112px;
 width:auto;
 display:block;
}

.topbar h1{
 margin:0;
 font-family:'Orbitron','Kanit',sans-serif;
 font-weight:900;
 font-size:clamp(22px,3vw,44px);
 letter-spacing:.08em;
 line-height:1.1;
 background:linear-gradient(90deg,#fff,#2edcff 55%,#1e7bff);
 background-clip:text;
 -webkit-background-clip:text;
 -webkit-text-fill-color:transparent;
}

.topbar p{
 margin:8px 0 0;
 font-size:16px;
 color:#7fb4e6;
}

.right{
 display:flex;
 align-items:center;
 gap:16px;
}

.live{
 display:flex;
 align-items:center;
 gap:10px;
 font-size:15px;
 font-weight:600;
 padding:10px 26px;
 background:rgba(46,220,255,.12);
 color:#cfeeff;
 clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);
}

.live-tag{
 font-family:'Orbitron';
 font-size:13px;
 font-weight:900;
 color:#fff;
}

.dot{
 width:10px;
 height:10px;
 border-radius:50%;
 background:#22e07a;
 box-shadow:0 0 4px rgba(34,224,122,.45);
 animation:blink 1.6s infinite;
}

@keyframes blink{50%{opacity:.25}}

#updateTime{font-size:13px;color:#9fd8ee}

.fs{
 border:1px solid rgba(46,220,255,.55);
 background:rgba(46,220,255,.12);
 color:#cfeeff;
 width:44px;
 height:44px;
 font-size:18px;
 cursor:pointer;
}

.fs:hover{background:rgba(46,220,255,.3)}

.stripe{
 height:3px;
 background:linear-gradient(90deg,transparent,#2edcff 18%,#1e7bff 50%,#2edcff 82%,transparent);
}

/* PAGE */

.page{
 max-width:1800px;
 margin:0 auto;
 padding:30px 36px 46px;
}

.boards{
 display:grid;
 grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);
 gap:30px;
 align-items:stretch;
}

/* BOARD */

.board{
 --cut:22px;
 position:relative;
 isolation:isolate;
 padding-bottom:16px;
}

.board:before{
 content:"";
 position:absolute;
 inset:0;
 z-index:-2;
 background:linear-gradient(135deg,rgba(var(--cr),1),rgba(var(--cr),.35) 55%,rgba(var(--cr),.9));
 clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
}

.board:after{
 content:"";
 position:absolute;
 inset:2px;
 z-index:-1;
 background:
 radial-gradient(circle at 50% 0,rgba(var(--cr),.12),transparent 55%),
 linear-gradient(180deg,rgba(14,32,66,.96),rgba(7,18,40,.98));
 clip-path:polygon(calc(var(--cut) - 2px) 0,100% 0,100% calc(100% - var(--cut) + 2px),calc(100% - var(--cut) + 2px) 100%,0 100%,0 calc(var(--cut) - 2px));
}

.idek{
 --cr:177,125,255;
 --ac:rgba(177,125,255,.6);
}

.wedo{
 --cr:255,196,0;
 --ac:rgba(255,196,0,.62);
}

.board-title{
 display:flex;
 align-items:center;
 gap:18px;
 padding:20px 26px 16px;
 margin:2px 2px 0;
 background:linear-gradient(90deg,rgba(var(--cr),.2),transparent 75%);
}

.board-title:before{
 content:"";
 width:10px;
 height:38px;
 background:rgb(var(--cr));
 transform:skewX(-18deg);
}

.board-title h2{
 margin:0;
 font-family:'Orbitron','Kanit',sans-serif;
 font-size:30px;
 font-weight:900;
 letter-spacing:.14em;
 color:#fff;
}

.board-title span{
 margin-left:auto;
 font-size:14px;
 color:#eaffff;
 padding:6px 22px;
 background:rgba(var(--cr),.2);
}

/* RANK BUTTON */

.rank-btn{
 margin-left:12px;
 font-family:'Orbitron','Kanit',sans-serif;
 font-weight:700;
 font-size:14px;
 letter-spacing:.1em;
 color:#1a0b33;
 background:linear-gradient(135deg,#e0c7ff,#b17dff);
 border:0;
 padding:7px 22px;
 cursor:pointer;
 clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);
}

.rank-btn:hover{filter:brightness(1.12)}
.rank-btn:disabled{opacity:.5;cursor:default}

.rank-btn.on{
 background:linear-gradient(135deg,#bbf7d0,#86efac);
 color:#14532d;
}

/* TABLE */

.head,.team{
 display:grid;
 align-items:center;
}

.idek .head,.idek .team{
 grid-template-columns:72px 130px 330px 1fr 1fr;
}

.head{
 margin:6px 14px 0;
 padding-left:6px;
 color:#9fd8ee;
 font-size:17px;
 font-weight:600;
 border-bottom:2px solid rgba(var(--cr),.6);
}

.head>div{padding:10px 14px}
.head .r{text-align:right}
.head .c{text-align:center}

.head small{
 display:block;
 font-size:11px;
 opacity:.7;
}

.team{
 --tc:14px;
 min-height:84px;
 margin:7px 14px 0;
 border-left:6px solid var(--rc,var(--ac));
 background:
 repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 2px,transparent 2px 9px),
 linear-gradient(90deg,rgba(27,65,128,.55),rgba(13,33,71,.35));
 clip-path:polygon(var(--tc) 0,100% 0,100% calc(100% - var(--tc)),calc(100% - var(--tc)) 100%,0 100%,0 var(--tc));
}

.team>div{padding:8px 14px}

.team-name{
 font-size:30px;
 font-weight:700;
}

.member{
 font-size:30px;
 color:#cdd7f5;
}

.score{
 font-family:'Orbitron','Kanit',sans-serif;
 font-size:32px;
 font-weight:900;
 text-align:right;
 color:#eaffff;
 letter-spacing:.06em;
}

.rank{display:flex}

.rank-badge{
 width:54px;
 height:54px;
 display:inline-flex;
 align-items:center;
 justify-content:center;
 font-family:'Orbitron';
 font-size:22px;
 font-weight:900;
 color:#cfeeff;
 background:rgba(46,220,255,.18);
 clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
}

/* TOP 3 */

.top-1{
 --rc:var(--gold);
 background:linear-gradient(90deg,rgba(255,196,0,.32),rgba(107,74,0,.16),rgba(13,33,71,.3));
}

.top-2{
 --rc:var(--silver);
 background:linear-gradient(90deg,rgba(200,210,220,.26),rgba(80,92,110,.14),rgba(13,33,71,.3));
}

.top-3{
 --rc:var(--bronze);
 background:linear-gradient(90deg,rgba(233,120,22,.28),rgba(90,45,10,.16),rgba(13,33,71,.3));
}

.top-1 .rank-badge{
 background:linear-gradient(135deg,var(--gold1),var(--gold2));
 color:#2b1b00;
}

.top-2 .rank-badge{
 background:linear-gradient(135deg,#f1f5f8,#8a97a5);
 color:#101826;
}

.top-3 .rank-badge{
 background:linear-gradient(135deg,#f6b877,#c0661c);
 color:#2b1300;
}

.top-1 .team-name{color:#fff3c4}
.top-1 .score{color:var(--gold1)}

.loading{
 padding:40px;
 text-align:center;
 color:#7fb4e6;
 font-size:17px;
}

/* iDEKTEP ROUNDS */

.team>.rd{
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:5px;
 margin:6px;
 padding:10px 10px 8px;
 border-radius:8px;
 border:1px solid rgba(255,255,255,.14);
 background:rgba(8,20,45,.5);
 position:relative;
}

.rd .rs{
 font-family:'Orbitron','Kanit',sans-serif;
 font-size:34px;
 font-weight:900;
 line-height:1.05;
 letter-spacing:.08em;
 padding-top:2px;
}

.rd .rt{
 font-size:22px;
 color:#b8caea;
 letter-spacing:.03em;
 margin-top:2px;
}

/* BEST ROUND - LIGHT GREEN */

.idek .team>.rd.best{
 background:rgba(134,239,172,.20);
 padding-top:17px;
}

.idek .rd.best .rs{
 color:#bbf7d0;
 text-shadow:none;
}

.idek .rd.best .rt{
 color:#dcfce7;
}

.idek .rd.best:after{
 content:"★ ดีที่สุด";
 position:absolute;
 top:3px;
 right:5px;
 font-size:8px;
 font-weight:700;
 background:#86efac;
 color:#14532d;
 padding:0 6px;
 line-height:11px;
 clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);
}

/* WEDO */

.wedo{
 display:flex;
 flex-direction:column;
}

.wedo #wedoData{
 flex:1;
 display:flex;
 flex-direction:column;
}

.wedo .head{min-height:64px}

.wedo .head,.wedo .team{
 grid-template-columns:60px 92px minmax(120px,1fr) 100px;
}

.wedo .team{
 flex:1 1 0;
 min-height:78px;
 max-height:100px;
}

.wedo .team-name{font-size:26px}
.wedo .member{font-size:30px}

.wedo .score{
 font-size:30px;
 color:#fff3c6;
}

.wedo .rank-badge{
 width:48px;
 height:48px;
 font-size:20px;
}

/* MOBILE */

@media(max-width:1150px){
 .boards{grid-template-columns:1fr}
}

@media(max-width:700px){
 .topbar{padding:12px 14px}
 .topbar p{display:none}
 .logo{height:58px}
 .brand{gap:12px}
 .live{padding:7px 16px;font-size:12px}
 .page{padding:16px 10px 30px}
 .fs{display:none}
 .board{--cut:14px}

 .idek .head,.idek .team{
  grid-template-columns:40px 56px minmax(0,1fr) 64px 64px;
 }

 .wedo .head,.wedo .team{
  grid-template-columns:40px 56px minmax(60px,1fr) 56px;
 }

 .head{font-size:12px;margin:4px 8px 0}
 .head>div,.team>div{padding:6px}

 .team{
  --tc:9px;
  min-height:60px;
  margin:6px 8px 0;
 }

 .team-name{font-size:15px}
 .member{font-size:14px}
 .score{font-size:18px}

 .wedo .head{min-height:0}

 .wedo .team{
  min-height:60px;
  max-height:none;
  flex:none;
 }

 .wedo .team-name{font-size:15px}
 .wedo .member{font-size:14px}
 .wedo .score{font-size:17px}

 .rank-badge,.wedo .rank-badge{
  width:34px;
  height:34px;
  font-size:14px;
 }

 .board-title{padding:14px 14px 10px}
 .board-title h2{font-size:20px}
 .board-title span{font-size:11px;padding:4px 14px}

 .rank-btn{font-size:11px;padding:5px 12px;margin-left:6px}

 .rd .rs{font-size:16px}
 .rd .rt{font-size:12px}

 .team>.rd{
  margin:3px 2px;
  padding:4px 2px;
 }

 .idek .rd.best:after{

  font-size:9px;
  padding:0 5px;
  right:2px;
 }
}

/* FULL SCREEN DISPLAY */

@media(min-width:1151px){

 html,body{
  height:100%;
  overflow:hidden;
 }

 body{
  height:100dvh;
  display:flex;
  flex-direction:column;
 }

 .topbar{
  padding:4px 20px;
  min-height:0;
  flex:0 0 auto;
 }

 .logo{height:44px}

 .topbar h1{
  font-size:clamp(18px,1.5vw,26px);
 }

 .topbar p{
  margin-top:0;
  font-size:11px;
 }

 .live{padding:5px 18px;font-size:13px}
 #updateTime{font-size:12px}

 .fs{width:34px;height:34px;font-size:15px}

 .stripe{
  height:2px;
  flex:0 0 auto;
 }

 .page{
  max-width:none;
  width:100%;
  padding:8px 16px 10px;
  flex:1 1 auto;
  height:auto;
  min-height:0;
  overflow:hidden;
 }

 .boards{
  height:100%;
  min-height:0;
  grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);
  gap:12px;
 }

 .board{
  display:flex;
  flex-direction:column;
  min-height:0;
  padding-bottom:6px;
 }

 .board-title{
  padding:4px 14px 4px;
  gap:12px;
  flex:0 0 auto;
 }

 .board-title h2{
  font-size:clamp(16px,1.3vw,22px);
 }

 .board-title:before{
  height:20px;
  width:6px;
 }

 .board-title span{
  font-size:12px;
  padding:3px 14px;
 }

 .rank-btn{
  font-size:clamp(10px,.8vw,12px);
  padding:3px 14px;
 }

 .head{

  font-size:clamp(11px,.8vw,14px);

 }

 .head>div{padding:3px 8px}

 .head small{font-size:9px;line-height:1.1}

 #idektepData,#wedoData{
  min-height:0;
  flex:1;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  scrollbar-width:none;
 }

 #idektepData::-webkit-scrollbar,
 #wedoData::-webkit-scrollbar{
  display:none;
 }

 .team,.wedo .team{
  min-height:0;
  max-height:none;
  flex:1 1 0;
  margin:4px 8px 0;
 }

 .team>div{
  padding:3px 8px;
  min-width:0;
 }

 .idek .head,.idek .team{
  grid-template-columns:
  minmax(48px,.55fr)
  minmax(70px,.85fr)
  minmax(130px,2.2fr)
  minmax(85px,1.15fr)
  minmax(85px,1.15fr);
 }

 .wedo .head,.wedo .team{
  grid-template-columns:
  minmax(42px,.65fr)
  minmax(65px,.85fr)
  minmax(100px,2fr)
  minmax(65px,.85fr);
 }

 .team-name,.wedo .team-name{
  font-size:clamp(15px,1.35vw,25px);
 }

 .member,.wedo .member{
  font-size:clamp(15px,1.35vw,25px);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
 }

 .score,.wedo .score{
  font-size:clamp(18px,1.55vw,29px);
 }

 .rank-badge,.wedo .rank-badge{
  width:clamp(29px,3vw,44px);
  height:clamp(29px,3vw,44px);
  font-size:clamp(14px,1.1vw,20px);
 }

 .idek .team>.rd{
  min-height:0;
  height:calc(100% - 6px);
  align-self:center;
  margin:3px 4px;
  padding:3px 7px;
  gap:2px;
  justify-content:center;
  overflow:hidden;
 }

 .idek .team>.rd.best{
  padding:12px 7px 3px;
 }

 .idek .rd .rs{

 }

}

@media(max-width:1150px) and (min-width:701px){
 .page{max-width:100%;padding:16px 18px}
 .boards{gap:16px}
 .idek .head,.idek .team{
  grid-template-columns:60px 85px minmax(130px,1fr) 120px 120px;
 }
 .idek .team>.rd.best{padding:9px 3px 3px}
}

@media(prefers-reduced-motion:reduce){
 .dot{animation:none}
}

html{scrollbar-width:none}
html::-webkit-scrollbar,
body::-webkit-scrollbar{display:none}

/* ===== RANK REVEAL ===== */

#reveal{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;overflow:hidden;color:#fff;
 background:radial-gradient(circle at 50% 65%,#17306a 0,#070b1c 62%,#03050f 100%);opacity:0;transition:opacity .6s}
#reveal.show{display:flex}
#reveal.in{opacity:1}
#reveal:before{content:"";position:absolute;inset:-60%;
 background:conic-gradient(from 0deg at 50% 62%,transparent 0 8%,rgba(46,220,255,.11) 10%,transparent 14% 33%,rgba(177,125,255,.11) 35%,transparent 39% 58%,rgba(46,220,255,.11) 60%,transparent 64% 83%,rgba(255,196,0,.09) 85%,transparent 89%);
 animation:rvspin 20s linear infinite}
#reveal:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:42px 42px}
@keyframes rvspin{to{transform:rotate(360deg)}}

#fx{position:absolute;inset:0;z-index:5;pointer-events:none}
.rv-flash{position:absolute;inset:0;z-index:7;background:#fff;opacity:0;pointer-events:none}
@keyframes flash{0%{opacity:var(--fo,.8)}100%{opacity:0}}
.rv-ctrl{position:absolute;top:14px;right:16px;z-index:9;display:flex;gap:8px}
.rv-ctrl button{font-family:'Kanit',sans-serif;font-size:14px;color:#cfeeff;background:rgba(46,220,255,.14);
 border:1px solid rgba(46,220,255,.5);padding:6px 16px;cursor:pointer}
.rv-ctrl button:hover{background:rgba(46,220,255,.3)}

.rv-head{position:relative;z-index:2;margin-top:3vh;text-align:center}
.rv-head small{font-family:'Orbitron',sans-serif;letter-spacing:.4em;color:var(--neon);font-size:clamp(10px,1.6vh,16px)}
.rv-head h2{margin:.4vh 0;font-family:'Orbitron','Kanit',sans-serif;font-weight:900;letter-spacing:.12em;font-size:clamp(22px,5.5vh,58px);
 background:linear-gradient(90deg,#fff,#b17dff 55%,#2edcff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rv-head p{margin:0;min-height:1.5em;color:#9fd8ee;font-size:clamp(14px,2.6vh,26px);animation:rvblink 1.2s ease-in-out infinite}
@keyframes rvblink{50%{opacity:.45}}

.rv-count{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none;
 font-family:'Orbitron',sans-serif;font-weight:900;font-size:min(38vh,38vw)}
.rv-count span{position:relative;display:inline-block;text-shadow:0 0 50px var(--neon),0 0 12px #fff;animation:cnt .95s ease-out forwards}
.rv-count span:after{content:"";position:absolute;inset:-14%;border:5px solid var(--neon);border-radius:50%;animation:ring .95s ease-out forwards}
@keyframes cnt{0%{transform:scale(2.6);opacity:0}22%{transform:scale(1);opacity:1}75%{opacity:1}100%{transform:scale(.7);opacity:0}}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}

.rv-stage{position:relative;z-index:3;flex:1;min-height:0;width:min(1100px,96vw);display:flex;align-items:flex-end;justify-content:center;
 gap:1.2vw;padding-bottom:4vh;opacity:0;transition:opacity .7s}
.rv-stage.on{opacity:1}
#reveal.shake .rv-stage{animation:rvshake .45s}
@keyframes rvshake{0%,100%{transform:none}20%{transform:translate(-8px,5px)}40%{transform:translate(7px,-6px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,4px)}}

.pod{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.pod.p1{--c:255,196,0;--h:clamp(150px,34vh,400px)}
.pod.p2{--c:200,210,220;--h:clamp(110px,24vh,290px)}
.pod.p3{--c:233,120,22;--h:clamp(80px,15vh,190px)}

.pblock{height:var(--h);transform-origin:bottom;display:flex;justify-content:center;align-items:flex-start;padding-top:1.5vh;
 font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(36px,9vh,110px);color:rgba(255,255,255,.2);

<script>

const IDEKTEP_API_URL =
"https://script.google.com/macros/s/AKfycbwEKF6Pabk1pbEYdihWp1ouxwdCpoHjikhH4Q5F7AqFX4zharAWgB6_7JOME9H1KhDJIQ/exec";

const WEDO_API_URL =
"https://script.google.com/macros/s/AKfycbzLrGq-lSyBgOlyqXDPlSHn_m0iW4PAWVr-DaGfDKY9iIWPL2hbkNP2gYb4CkoU-ZFndw/exec";

const num=v=>{
 const n=parseFloat(String(v??'').replace(/,/g,''));
 return Number.isFinite(n)?n:NaN;
};

const toSec=v=>{
 const p=String(v??'').split(':').map(parseFloat);
 return p.some(x=>!Number.isFinite(x))
 ?Infinity
 :p.reduce((a,x)=>a*60+x,0);
};

const cmp=(x,y)=>x===y?0:x-y;

const isHeaderRow=t=>
 !t||t==='TEAM'||t.includes('GO ROBOT')||t.includes('SCORE BOARD');

function escapeHtml(value){
 return String(value??'').replace(
  /[&<>'"]/g,
  ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch])
 );
}

/* WEDO */

function cleanRows(raw){
 if(!Array.isArray(raw))return [];

 return raw.map(row=>({
  team:row[1]?String(row[1]).trim():'',
  member:row[2]?String(row[2]).trim():'',
  score:row[4]?String(row[4]).trim():''
 })).filter(r=>!isHeaderRow(r.team));
}

function rankClass(rank){
 return rank<=3?`top-${rank}`:'';
}

function rowHtml(r,rank){
 return `
 <div class="team ${rankClass(rank)}">
  <div class="rank">
   <span class="rank-badge">${rank}</span>
  </div>
  <div class="team-name">${escapeHtml(r.team)||'-'}</div>
  <div class="member">${escapeHtml(r.member)||'-'}</div>
  <div class="score">${escapeHtml(r.score)||'-'}</div>
 </div>`;
}

function renderWedo(raw){
 const board=document.getElementById('wedoData');
 const rows=cleanRows(raw);

 rows.sort((a,b)=>(num(b.score)||0)-(num(a.score)||0));

 board.innerHTML=rows.length
 ?rows.map((r,i)=>rowHtml(r,i+1)).join('')
 :'<div class="loading">ไม่พบข้อมูล</div>';
}

/* iDEKTEP */

/* rankMode = false : เรียงตามรหัสทีม IDT, รอบ 2 ถูกซ่อน (โชว์แค่ตัวหน้า), ไม่ไฮไลต์
   rankMode = true  : เรียงตามคะแนนที่ดีที่สุด, โชว์รอบ 2 เต็ม, ไฮไลต์รอบที่ดีที่สุด */

let rankMode=false;
let idektepRaw=[];

function cleanIdektep(raw){
 if(!Array.isArray(raw))return [];

 const s=v=>v!=null?String(v).trim():'';

 return raw.map(row=>({
  team:s(row[1]),
  member:s(row[2]),
  rounds:[
   {score:s(row[4]),time:s(row[5])},
   {score:s(row[6]),time:s(row[7])}
  ]
 })).filter(r=>!isHeaderRow(r.team));
}

/* คะแนนสูงสุด ถ้าเท่ากันเลือกเวลาน้อยสุด */

function bestRound(rounds){
 let best=-1;

 rounds.forEach((r,i)=>{
  const sc=num(r.score);

  if(Number.isNaN(sc))return;

  if(best<0){
   best=i;
   return;
  }

  const b=rounds[best];
  const bs=num(b.score);

  if(sc>bs||(sc===bs&&toSec(r.time)<toSec(b.time))){
   best=i;
  }
 });

 return best;
}

/* ซ่อนค่า: คะแนน 245 -> 2xx , เวลา 3.45.12 -> 3.xx.xx */

function maskScore(v){
 const s=String(v??'').trim();
 return s?escapeHtml(s.charAt(0))+'x'.repeat(Math.max(s.length-1,1)):'-';
}

function maskTime(v){
 const s=String(v??'').trim();
 return s?escapeHtml(s.charAt(0))+'.xx.xx':'-';
}

function idekRowHtml(r,rank){

 const cells=r.rounds.map((x,i)=>{
  const hide=!rankMode&&i===1;
  const isBest=rankMode&&i===r.best;
  const sc=hide?maskScore(x.score):(escapeHtml(x.score)||'-');
  const tm=hide?maskTime(x.time):(escapeHtml(x.time)||'-');

  return `
  <div class="rd${isBest?' best':''}">
   <span class="rs">${sc}</span>
   <span class="rt">${tm}</span>
  </div>`;
 }).join('');

 return `
 <div class="team ${rankMode?rankClass(rank):''}" data-team="${escapeHtml(r.team)}">
  <div class="rank">
   <span class="rank-badge">${rankMode?rank:'-'}</span>
  </div>
  <div class="team-name">${escapeHtml(r.team)||'-'}</div>
  <div class="member">${escapeHtml(r.member)||'-'}</div>
  ${cells}
 </div>`;
}

function renderIdektep(raw){
 if(raw){
  if(revealing){pendingRaw=raw;return;}
  idektepRaw=raw;
 }

 const board=document.getElementById('idektepData');

 const rows=cleanIdektep(idektepRaw).map(r=>{
  const b=bestRound(r.rounds);

  return {
   ...r,
   best:b,
   bs:b>=0?num(r.rounds[b].score):-Infinity,
   bt:b>=0?toSec(r.rounds[b].time):Infinity
  };
 });

 if(rankMode){
  rows.sort((a,b)=>cmp(b.bs,a.bs)||cmp(a.bt,b.bt));
 }else{
  rows.sort((a,b)=>a.team.localeCompare(b.team,undefined,{numeric:true,sensitivity:'base'}));
 }

 board.innerHTML=rows.length

/* API */

async function fetchJson(url){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),10000);

 try{
  const res=await fetch(url,{
   cache:'no-store',
   signal:controller.signal
  });

  if(!res.ok)throw new Error(`HTTP ${res.status}`);

  const data=await res.json();

  if(!data.success){
   throw new Error(data.error||'API error');
  }

  return data;
 }finally{
  clearTimeout(timeout);
 }
}

let hasIdektepData=false;
let hasWedoData=false;

/* ---------- AUDIO (สังเคราะห์เสียงเอง ไม่ต้องใช้ไฟล์) ---------- */

let AC=null,master=null,bus=null,noiseBuf=null;

function initAudio(){
 try{
  if(!AC){
   const C=window.AudioContext||window.webkitAudioContext;
   if(!C)return;
   AC=new C();
   master=AC.createGain();master.gain.value=.66;
   const cp=AC.createDynamicsCompressor();
   cp.threshold.value=-19;cp.knee.value=14;cp.ratio.value=7;
   cp.attack.value=.005;cp.release.value=.23;
   master.connect(cp);cp.connect(AC.destination);
   noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
   const d=noiseBuf.getChannelData(0);
   for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(AC.state==='suspended')AC.resume();
  bus=AC.createGain();bus.gain.value=soundOn?1:0;bus.connect(master);
 }catch(e){console.warn(e)}
}

function fadeBus(){
 if(!AC||!bus)return;
 const b=bus,t=AC.currentTime;
 b.gain.cancelScheduledValues(t);
 b.gain.setValueAtTime(b.gain.value,t);
 b.gain.linearRampToValueAtTime(0,t+.4);
 setTimeout(()=>{try{b.disconnect()}catch(e){}},600);
}

const S={};
const def=(n,f)=>{S[n]=(...a)=>{if(AC&&bus&&soundOn){try{f(...a)}catch(e){console.warn(e)}}}};

function env(g,t,a,peak,d){
 g.gain.setValueAtTime(.0001,t);
 g.gain.exponentialRampToValueAtTime(peak,t+a);
 g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
}
function tone(type,f,t,a,d,peak,f2,dest){
 const o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);
 if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+d);
 env(g,t,a,peak,d);o.connect(g);g.connect(dest||bus);
 o.start(t);o.stop(t+a+d+.05);
}
function noise(t,dur,type,f,f2,peak,dest){
 const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
 s.buffer=noiseBuf;s.loop=dur>noiseBuf.duration;
 fl.type=type;fl.frequency.setValueAtTime(f,t);
 if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
 env(g,t,.005,peak,dur);
 s.connect(fl);fl.connect(g);g.connect(dest||bus);
 s.start(t);s.stop(t+dur+.05);
}
function snare(t,v){
 noise(t,.13,'bandpass',1500,2200,v*.8);
 tone('triangle',142,t,.002,.08,v*.48,90);
}

/* Cinematic snare: ค่อย ๆ รัวเร็วและหนักขึ้นแบบงานประกาศรางวัล */
def('roll',(dur,r0,r1,v0,v1)=>{
 const t0=AC.currentTime+.02;
 let t=t0;
 while(t<t0+dur){
  const p=(t-t0)/dur;
  snare(t,(v0+(v1-v0)*p)*.75);
  t+=1/(r0+(r1-r0)*p);
 }
});

def('tick',n=>{
 const t=AC.currentTime;
 tone('triangle',n===1?740:550,t,.003,.16,.16,n===1?520:370);
 tone('sine',82,t,.003,.27,.32,49);
});

/* เสียงหัวใจเต้นสองจังหวะ: ตุ้บ-ตุ้บ แบบลุ้นผล */
function heartAt(t,v){
 tone('sine',100,t,.004,.19,v,48);
 tone('triangle',148,t,.004,.09,v*.23,83);
 tone('sine',93,t+.19,.004,.17,v*.78,43);
 tone('triangle',137,t+.19,.004,.08,v*.19,77);
}
def('heartbeat',(dur=3,slow=.83,fast=.48)=>{
 const start=AC.currentTime+.02;
 for(let t=start;t<start+dur;){
  const progress=(t-start)/dur;
  heartAt(t,.26+progress*.27);
  t+=slow+(fast-slow)*progress;
 }
});

/* ดนตรีค้างต่ำ ๆ เป็นคอร์ดไมเนอร์ ช่วยสร้างความกดดัน */
def('tension',(dur=2.6)=>{
 const t=AC.currentTime+.01;
 [110,130.81,164.81,220].forEach((freq,i)=>{
  const osc=AC.createOscillator(),gain=AC.createGain(),filter=AC.createBiquadFilter();
  osc.type=i===3?'sine':'triangle';osc.frequency.value=freq;
  filter.type='lowpass';filter.frequency.setValueAtTime(430,t);
  filter.frequency.linearRampToValueAtTime(1550,t+dur);
  gain.gain.setValueAtTime(.0001,t);
  gain.gain.linearRampToValueAtTime(i===0?.055:.028,t+Math.min(.7,dur*.3));
  gain.gain.setValueAtTime(i===0?.055:.028,t+Math.max(.7,dur*.72));
  gain.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(filter);filter.connect(gain);gain.connect(bus);
  osc.start(t);osc.stop(t+dur+.03);
 });
});

def('whoosh',()=>{
 const t=AC.currentTime;
 noise(t,.57,'bandpass',280,4300,.35);
 tone('sine',120,t,.003,.43,.13,245);
});

def('boom',big=>{
 const t=AC.currentTime;
 tone('sine',big?105:90,t,.003,big?1.2:.7,big?.78:.5,37);
 tone('triangle',big?165:130,t,.003,big?.42:.3,big?.3:.18,56);
 noise(t,big?1.1:.57,'lowpass',big?3100:1900,130,big?.55:.34);
 if(big){
  noise(t+.06,.85,'bandpass',2700,600,.16);
  tone('sine',44,t+.06,.009,1.5,.35,34);
 }
});

def('riser',d=>{
 const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
 o.type='sawtooth';
 o.frequency.setValueAtTime(92,t);o.frequency.exponentialRampToValueAtTime(460,t+d);
 f.type='lowpass';
 f.frequency.setValueAtTime(280,t);f.frequency.exponentialRampToValueAtTime(3800,t+d);
 g.gain.setValueAtTime(.0001,t);
 g.gain.exponentialRampToValueAtTime(.13,t+d*.86);
 g.gain.setValueAtTime(.13,t+d*.92);
 g.gain.linearRampToValueAtTime(0,t+d+.04);
 o.connect(f);f.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.1);
 noise(t,d,'bandpass',350,4500,.075);
});

def('drone',d=>{
 const t=AC.currentTime;
 [55,82.5,110].forEach(fr=>{
  const o=AC.createOscillator(),g=AC.createGain(),l=AC.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=fr;
  l.type='lowpass';l.frequency.value=380;
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(.045,t+Math.min(1.5,d*.35));
  g.gain.linearRampToValueAtTime(.0001,t+d);
  o.connect(l);l.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.1);
 });
});

function brass(f,t,d){
 [f,f*1.006].forEach(fr=>{
  const o=AC.createOscillator(),g=AC.createGain(),l=AC.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=fr;
  l.type='lowpass';
  l.frequency.setValueAtTime(900,t);l.frequency.linearRampToValueAtTime(3500,t+.08);
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(.055,t+.045);
  g.gain.setValueAtTime(.055,t+d*.65);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(l);l.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.05);
 });
}

def('fanfare',()=>{
 const t=AC.currentTime;
 /* ทำนองชัยชนะ C major แบบเวทีแชมป์ ไม่ใช้ไฟล์เสียงภายนอก */
 [[0,[392,523]],[.24,[440,587]],[.48,[494,659]],[.78,[523,659,784]],
  [1.5,[523,659,784,1047]]].forEach(([dt,ns],i)=>ns.forEach(f=>brass(f,t+dt,i<3?.2:i===3?.65:2)));
 for(let i=0;i<7;i++)tone('sine',1047+i*115,t+.8+i*.11,.004,.4,.035);
});

/* ---------- CONFETTI ---------- */

const cv=$('fx'),cx=cv.getContext('2d');
let parts=[],raf=0;

function burst(n,x,y,spread){
 const cols=['#ffc400','#ffe27a','#2edcff','#b17dff','#ffffff','#ff9d00'];
 for(let i=0;i<n;i++){
  const a=-Math.PI/2+(Math.random()-.5)*spread,s=8+Math.random()*16;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:6+Math.random()*8,h:4+Math.random()*6,
   r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1});
 }
 if(!raf)loop();
}

function loop(){
 cx.clearRect(0,0,cv.width,cv.height);
 parts=parts.filter(p=>p.life>0&&p.y<cv.height+40);
 parts.forEach(p=>{
  p.vy+=.35;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.004;
  cx.save();cx.globalAlpha=Math.min(1,p.life*2);
  cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
  cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
 });
 raf=parts.length?requestAnimationFrame(loop):0;
 if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

function rankedRows(){
 return cleanIdektep(idektepRaw).map(r=>{
  const b=bestRound(r.rounds);
  return {...r,best:b,
   bs:b>=0?num(r.rounds[b].score):-Infinity,
   bt:b>=0?toSec(r.rounds[b].time):Infinity};
 }).filter(r=>r.best>=0)
 .sort((a,b)=>cmp(b.bs,a.bs)||cmp(a.bt,b.bt));
}

function scramble(el,final,dur){
 dur=dur||600;
 const ch='0123456789ABCDEFGHJKLMNPRSTUVWXYZ#%&';
 const t0=performance.now();
 const step=()=>{
  const p=(performance.now()-t0)/dur;
  if(p>=1||skipped){el.textContent=final;return;}
  const n=Math.floor(final.length*p);
  el.textContent=final.slice(0,n)+[...final.slice(n)].map(c=>/[\s.:\-]/.test(c)?c:ch[Math.random()*ch.length|0]).join('');
  requestAnimationFrame(step);
 };
 step();
}

 if(revealing)return;

 const all=rankedRows(),top=all.slice(0,3),mid=all.slice(3,10);
 if(!top.length){setRank(true);return;}

 revealing=true;skipped=false;rejects=[];parts=[];revealGeneration++;
 $('rankBtn').disabled=true;

 initAudio();
 buildStage(top);

 cv.width=innerWidth;cv.height=innerHeight;
 const rv=$('reveal');
 rv.className='show';void rv.offsetWidth;rv.classList.add('in');
 $('rvSub').textContent='กำลังประกาศอันดับ...';

 try{
  S.drone(top.length===3?50:30);
  S.tension(3);
  await wait(900);

  /* เปิดฉาก: เสียงนับถอยหลังหนักแน่นและหัวใจเริ่มเต้น */
  S.heartbeat(3.1,1,.72);
  S.roll(3,5,16,.045,.18);
  for(const n of [3,2,1]){
   $('rvCount').innerHTML=`<span>${n}</span>`;
   S.tick(n);
   await wait(950);
  }
  $('rvCount').innerHTML='';

  /* อันดับ 4-10 ก่อน */
  if(top.length===3){
   await showMid(mid);
   $('rvSub').textContent='และนี่คือ TOP 3';
   S.tension(1.7);
   S.riser(1.6);
   $('rvStage').classList.add('on');
   await wait(1700);
  }else{
   $('rvStage').classList.add('on');
   await wait(500);
  }

  /* อันดับ 3 และ 2 ขึ้นบันไดทีละขั้น */
  for(let k=top.length;k>=2;k--){
   $('rvSub').textContent=`เตรียมประกาศอันดับ ${k}...`;
   S.tension(2.7);
   S.heartbeat(2.8,.85,.45);
   S.roll(2.7,6,27,.05,.3);
   await wait(2600);
   $('rvSub').textContent=`อันดับ ${k} ได้แก่...`;
   await showPod(k);
   await wait(3200);
  }

  /* รอบชิง: หัวใจเร่งจังหวะ + ดนตรีไต่ระดับ ก่อนเว้นจังหวะแล้วเฉลย */
  $('rvSub').textContent='ใครจะเป็นแชมป์ GO ROBOT CHALLENGE 2026?';
  $('rvStage').classList.add('focus');
  $('rvStage').classList.add('suspense');
  $('pod1').classList.add('tease');
  S.tension(5.1);
  S.heartbeat(4.9,.78,.31);
  S.riser(4.8);
  S.roll(4.8,8,39,.055,.39);
  await wait(3500);
  $('rvSub').textContent='และผู้ชนะอันดับ 1 ได้แก่...';
  await wait(1550);
  $('rvStage').classList.remove('suspense');
  await showPod(1);
  $('rvSub').textContent='🏆 ขอแสดงความยินดีกับทีมแชมป์! 🏆';
  await wait(6500);

 }catch(e){
  if(e!==SKIP)console.error(e);
 }

 endReveal();
}

function endReveal(){
 revealGeneration++;
 fadeBus();
 rejects=[];parts=[];

 if(pendingRaw){idektepRaw=pendingRaw;pendingRaw=null;}

 const board=$('idektepData');
 const first=new Map([...board.querySelectorAll('.team')]
  .map(e=>[e.dataset.team,e.getBoundingClientRect().top]));

 setRank(true);

 const card=document.querySelector('.board.idek');
 card.classList.add('rank-in');

 /* แถวเด้งจากลำดับตามรหัสทีม ไปเข้าลำดับ RANK */
 const rows=[...board.querySelectorAll('.team')];
 rows.forEach(e=>{
  const o=first.get(e.dataset.team);
  if(o==null)return;
  e.style.transition='none';
  e.style.transform=`translateY(${o-e.getBoundingClientRect().top}px) scale(.96)`;
  e.style.opacity='.5';
 });
 void board.offsetWidth;
 rows.forEach((e,i)=>{
  e.style.transition=`transform 1s cubic-bezier(.34,1.56,.64,1) ${i*45}ms,opacity .4s ${i*45}ms`;
  e.style.transform='';
  e.style.opacity='';
  if(i<10)setTimeout(()=>pop(i),i*45+150);
 });

 const rv=$('reveal');
 rv.classList.remove('in');
 setTimeout(()=>{rv.className='';$('rvCount').innerHTML='';$('rvList').className='rv-list';$('rvList').innerHTML=''},700);

 setTimeout(()=>{
  card.classList.remove('rank-in');
  revealing=false;
  $('rankBtn').disabled=false;
  if(pendingRaw){const p=pendingRaw;pendingRaw=null;renderIdektep(p);}
 },1300+rows.length*45);
}

function setRank(on){
 rankMode=on;
 const btn=$('rankBtn');
 btn.classList.toggle('on',on);
 btn.textContent=on?'ซ่อนอันดับ':'RANK';
 renderIdektep();
}

function toggleRank(){
 if(revealing)return;
 if(rankMode){setRank(false);return;}
 startReveal();
}

loadAll();

</script>
</body>
</html>
