
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO ROBOT CHALLENGE 2026 - WEDO & iDekTep</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

:root{
 --bg:#080d21;
 --text:#f4f8ff;
 --dim:#8ea4c4;
 --neon:#2edcff;
 --neon2:#1e7bff;
 --violet:#b17dff;
 --gold:#ffc400;
 --gold1:#ffe27a;
 --gold2:#ff9d00;
 --silver:#c8d2dc;
 --bronze:#e97816;
 --best-green:#86efac;
}

html,body{margin:0;min-height:100%}

body{
 font-family:'Kanit',Tahoma,sans-serif;
 color:var(--text);
 font-variant-numeric:tabular-nums;
 min-height:100vh;
 background:
 radial-gradient(circle at 50% 38%,rgba(31,94,153,.22),transparent 42%),
 linear-gradient(135deg,#080d21 0%,#0c1430 48%,#111e3b 100%);
 background-attachment:fixed;
}

body:before{
 content:"";
 position:fixed;
 inset:0;
 pointer-events:none;
 z-index:0;
 background:
 linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
 background-size:42px 42px;
 mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 85%);
}

.topbar,.stripe,.page{position:relative;z-index:1}

/* HEADER */

.topbar{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:24px;
 padding:18px 36px;
}

.brand{display:flex;align-items:center;gap:22px}

.logo{
 height:112px;
 width:auto;
 display:block;
}

.topbar h1{
 margin:0;
 font-family:'Orbitron','Kanit',sans-serif;
 font-weight:900;
 font-size:clamp(22px,3vw,44px);
 letter-spacing:.08em;
 line-height:1.1;
 background:linear-gradient(90deg,#fff,#2edcff 55%,#1e7bff);
 background-clip:text;
 -webkit-background-clip:text;
 -webkit-text-fill-color:transparent;
}

.topbar p{
 margin:8px 0 0;
 font-size:16px;
 color:#7fb4e6;
}

.right{
 display:flex;
 align-items:center;
 gap:16px;
}

.live{
 display:flex;
 align-items:center;
 gap:10px;
 font-size:15px;
 font-weight:600;
 padding:10px 26px;
 background:rgba(46,220,255,.12);
 color:#cfeeff;
 clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);
}

.live-tag{
 font-family:'Orbitron';
 font-size:13px;
 font-weight:900;
 color:#fff;
}

.dot{
 width:10px;
 height:10px;
 border-radius:50%;
 background:#22e07a;
 box-shadow:0 0 4px rgba(34,224,122,.45);
 animation:blink 1.6s infinite;
}

@keyframes blink{50%{opacity:.25}}

#updateTime{font-size:13px;color:#9fd8ee}

.fs{
 border:1px solid rgba(46,220,255,.55);
 background:rgba(46,220,255,.12);
 color:#cfeeff;
 width:44px;
 height:44px;
 font-size:18px;
 cursor:pointer;
}

.fs:hover{background:rgba(46,220,255,.3)}

.stripe{
 height:3px;
 background:linear-gradient(90deg,transparent,#2edcff 18%,#1e7bff 50%,#2edcff 82%,transparent);
}

/* PAGE */

.page{
 max-width:1800px;
 margin:0 auto;
 padding:30px 36px 46px;
}

.boards{
 display:grid;
 grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);
 gap:30px;
 align-items:stretch;
}

/* BOARD */

.board{
 --cut:22px;
 position:relative;
 isolation:isolate;
 padding-bottom:16px;
}

.board:before{
 content:"";
 position:absolute;
 inset:0;
 z-index:-2;
 background:linear-gradient(135deg,rgba(var(--cr),1),rgba(var(--cr),.35) 55%,rgba(var(--cr),.9));
 clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
}

.board:after{
 content:"";
 position:absolute;
 inset:2px;
 z-index:-1;
 background:
 radial-gradient(circle at 50% 0,rgba(var(--cr),.12),transparent 55%),
 linear-gradient(180deg,rgba(14,32,66,.96),rgba(7,18,40,.98));
 clip-path:polygon(calc(var(--cut) - 2px) 0,100% 0,100% calc(100% - var(--cut) + 2px),calc(100% - var(--cut) + 2px) 100%,0 100%,0 calc(var(--cut) - 2px));
}

.idek{
 --cr:177,125,255;
 --ac:rgba(177,125,255,.6);
}

.wedo{
 --cr:255,196,0;
 --ac:rgba(255,196,0,.62);
}

.board-title{
 display:flex;
 align-items:center;
 gap:18px;
 padding:20px 26px 16px;
 margin:2px 2px 0;
 background:linear-gradient(90deg,rgba(var(--cr),.2),transparent 75%);
}

.board-title:before{
 content:"";
 width:10px;
 height:38px;
 background:rgb(var(--cr));
 transform:skewX(-18deg);
}

.board-title h2{
 margin:0;
 font-family:'Orbitron','Kanit',sans-serif;
 font-size:30px;
 font-weight:900;
 letter-spacing:.14em;
 color:#fff;
}

.board-title span{
 margin-left:auto;
 font-size:14px;
 color:#eaffff;
 padding:6px 22px;
 background:rgba(var(--cr),.2);
}

/* TABLE */

.head,.team{
 display:grid;
 align-items:center;
}

.idek .head,.idek .team{
 grid-template-columns:72px 130px 330px 1fr 1fr;
}

.head{
 margin:6px 14px 0;
 padding-left:6px;
 color:#9fd8ee;
 font-size:17px;
 font-weight:600;
 border-bottom:2px solid rgba(var(--cr),.6);
}

.head>div{padding:10px 14px}
.head .r{text-align:right}
.head .c{text-align:center}

.head small{
 display:block;
 font-size:11px;
 opacity:.7;
}

.team{
 --tc:14px;
 min-height:84px;
 margin:7px 14px 0;
 border-left:6px solid var(--rc,var(--ac));
 background:
 repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 2px,transparent 2px 9px),
 linear-gradient(90deg,rgba(27,65,128,.55),rgba(13,33,71,.35));
 clip-path:polygon(var(--tc) 0,100% 0,100% calc(100% - var(--tc)),calc(100% - var(--tc)) 100%,0 100%,0 var(--tc));
}

.team>div{padding:8px 14px}

.team-name{
 font-size:30px;
 font-weight:700;
}

.member{
 font-size:30px;
 color:#cdd7f5;
}

.score{
 font-family:'Orbitron','Kanit',sans-serif;
 font-size:32px;
 font-weight:900;
 text-align:right;
 color:#eaffff;
 letter-spacing:.06em;
}

.rank{display:flex}

.rank-badge{
 width:54px;
 height:54px;
 display:inline-flex;
 align-items:center;
 justify-content:center;
 font-family:'Orbitron';
 font-size:22px;
 font-weight:900;
 color:#cfeeff;
 background:rgba(46,220,255,.18);
 clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
}

/* TOP 3 */

.top-1{
 --rc:var(--gold);
 background:linear-gradient(90deg,rgba(255,196,0,.32),rgba(107,74,0,.16),rgba(13,33,71,.3));
}

.top-2{
 --rc:var(--silver);
 background:linear-gradient(90deg,rgba(200,210,220,.26),rgba(80,92,110,.14),rgba(13,33,71,.3));
}

.top-3{
 --rc:var(--bronze);
 background:linear-gradient(90deg,rgba(233,120,22,.28),rgba(90,45,10,.16),rgba(13,33,71,.3));
}

.top-1 .rank-badge{
 background:linear-gradient(135deg,var(--gold1),var(--gold2));
 color:#2b1b00;
}

.top-2 .rank-badge{
 background:linear-gradient(135deg,#f1f5f8,#8a97a5);
 color:#101826;
}

.top-3 .rank-badge{
 background:linear-gradient(135deg,#f6b877,#c0661c);
 color:#2b1300;
}

.top-1 .team-name{color:#fff3c4}
.top-1 .score{color:var(--gold1)}

.loading{
 padding:40px;
 text-align:center;
 color:#7fb4e6;
 font-size:17px;
}

/* iDEKTEP ROUNDS */

.team>.rd{
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:5px;
 margin:6px;
 padding:10px 10px 8px;
 border-radius:8px;
 border:1px solid rgba(255,255,255,.14);
 background:rgba(8,20,45,.5);
 position:relative;
}

.rd .rs{
 font-family:'Orbitron','Kanit',sans-serif;
 font-size:34px;
 font-weight:900;
 line-height:1.05;
 letter-spacing:.08em;
 padding-top:2px;
}

.rd .rt{
 font-size:22px;
 color:#b8caea;
 letter-spacing:.03em;
 margin-top:2px;
}

/* ============================================
   BEST ROUND - LIGHT GREEN
   ไฮไลต์รอบดีที่สุดสีเขียวอ่อน
   ============================================ */

.idek .team>.rd.best{
 background:rgba(134,239,172,.20);
 border:2px solid #86efac;
 box-shadow:inset 0 0 0 1px rgba(134,239,172,.15);
 padding-top:22px;
}

.idek .rd.best .rs{
 color:#bbf7d0;
 text-shadow:none;
}

.idek .rd.best .rt{
 color:#dcfce7;
}

.idek .rd.best:after{
 content:"★ ดีที่สุด";
 position:absolute;
 top:5px;
 right:7px;
 font-size:10px;
 font-weight:700;
 background:#86efac;
 color:#14532d;
 padding:1px 9px;
 line-height:16px;
 clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);
}

/* WEDO */

.wedo{
 display:flex;
 flex-direction:column;
}

.wedo #wedoData{
 flex:1;
 display:flex;
 flex-direction:column;
}

.wedo .head{min-height:64px}

.wedo .head,.wedo .team{
 grid-template-columns:60px 92px minmax(120px,1fr) 100px;
}

.wedo .team{
 flex:1 1 0;
 min-height:78px;
 max-height:100px;
}

.wedo .team-name{font-size:26px}
.wedo .member{font-size:30px}

.wedo .score{
 font-size:30px;
 color:#fff3c6;
}

.wedo .rank-badge{
 width:48px;
 height:48px;
 font-size:20px;
}

/* MOBILE */

@media(max-width:1150px){
 .boards{grid-template-columns:1fr}
}

@media(max-width:700px){
 .topbar{padding:12px 14px}
 .topbar p{display:none}
 .logo{height:58px}
 .brand{gap:12px}
 .live{padding:7px 16px;font-size:12px}
 .page{padding:16px 10px 30px}
 .fs{display:none}
 .board{--cut:14px}

 .idek .head,.idek .team{
  grid-template-columns:40px 56px minmax(0,1fr) 64px 64px;
 }

 .wedo .head,.wedo .team{
  grid-template-columns:40px 56px minmax(60px,1fr) 56px;
 }

 .head{font-size:12px;margin:4px 8px 0}
 .head>div,.team>div{padding:6px}

 .team{
  --tc:9px;
  min-height:60px;
  margin:6px 8px 0;
 }

 .team-name{font-size:15px}
 .member{font-size:14px}
 .score{font-size:18px}

 .wedo .head{min-height:0}

 .wedo .team{
  min-height:60px;
  max-height:none;
  flex:none;
 }

 .wedo .team-name{font-size:15px}
 .wedo .member{font-size:14px}
 .wedo .score{font-size:17px}

 .rank-badge,.wedo .rank-badge{
  width:34px;
  height:34px;
  font-size:14px;
 }

 .board-title{padding:14px 14px 10px}
 .board-title h2{font-size:20px}
 .board-title span{font-size:11px;padding:4px 14px}

 .rd .rs{font-size:16px}
 .rd .rt{font-size:12px}

 .team>.rd{
  margin:3px 2px;
  padding:4px 2px;
 }

 .idek .team>.rd.best{padding:9px 3px 3px}

 .idek .rd.best:after{
  content:"★";
  font-size:9px;
  padding:0 5px;
  right:2px;
 }
}

/* FULL SCREEN DISPLAY */

@media(min-width:1151px){

 html,body{
  height:100%;
  overflow:hidden;
 }

 body{
  height:100dvh;
  display:flex;
  flex-direction:column;
 }

 .topbar{
  padding:10px 24px;
  min-height:82px;
  flex:0 0 auto;
 }

 .logo{height:66px}

 .topbar h1{
  font-size:clamp(23px,2vw,36px);
 }

 .topbar p{
  margin-top:3px;
  font-size:12px;
 }

 .stripe{
  height:2px;
  flex:0 0 auto;
 }

 .page{
  max-width:none;
  width:100%;
  padding:12px 20px 18px;
  flex:1 1 auto;
  height:auto;
  min-height:0;
  overflow:hidden;
 }

 .boards{
  height:100%;
  min-height:0;
  grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);
  gap:16px;
 }

 .board{
  display:flex;
  flex-direction:column;
  min-height:0;
  padding-bottom:8px;
 }

 .board-title{
  padding:9px 17px 8px;
  flex:0 0 auto;
 }

 .board-title h2{
  font-size:clamp(19px,1.6vw,28px);
 }

 .board-title:before{
  height:27px;
  width:7px;
 }

 .head{
  flex:0 0 auto;
  font-size:clamp(12px,.9vw,16px);
  margin:3px 8px 0;
 }

 .head>div{padding:6px 8px}

 .head small{font-size:10px}

 #idektepData,#wedoData{
  min-height:0;
  flex:1;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  scrollbar-width:none;
 }

 #idektepData::-webkit-scrollbar,
 #wedoData::-webkit-scrollbar{
  display:none;
 }

 .team,.wedo .team{
  min-height:0;
  max-height:none;
  flex:1 1 0;
  margin:4px 8px 0;
 }

 .team>div{
  padding:3px 8px;
  min-width:0;
 }

 .idek .head,.idek .team{
  grid-template-columns:
  minmax(48px,.55fr)
  minmax(70px,.85fr)
  minmax(130px,2.2fr)
  minmax(85px,1.15fr)
  minmax(85px,1.15fr);
 }

 .wedo .head,.wedo .team{
  grid-template-columns:
  minmax(42px,.65fr)
  minmax(65px,.85fr)
  minmax(100px,2fr)
  minmax(65px,.85fr);
 }

 .team-name,.wedo .team-name{
  font-size:clamp(15px,1.35vw,25px);
 }

 .member,.wedo .member{
  font-size:clamp(15px,1.35vw,25px);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
 }

 .score,.wedo .score{
  font-size:clamp(18px,1.55vw,29px);
 }

 .rank-badge,.wedo .rank-badge{
  width:clamp(29px,3vw,44px);
  height:clamp(29px,3vw,44px);
  font-size:clamp(14px,1.1vw,20px);
 }

 .idek .team>.rd{
  min-height:0;
  height:calc(100% - 6px);
  align-self:center;
  margin:3px 4px;
  padding:3px 7px;
  gap:2px;
  justify-content:center;
  overflow:hidden;
 }

 .idek .team>.rd.best{
  padding:11px 7px 3px;
 }

 .idek .rd .rs{
  font-size:clamp(17px,1.55vw,27px);
  line-height:1.06;
  padding:0;
  margin:0;
  flex-shrink:0;
 }

 .idek .rd .rt{
  font-size:clamp(12px,.9vw,16px);
  line-height:1.15;
  margin:0;
  flex-shrink:0;
 }

 .idek .rd.best:after{
  top:2px;
  right:4px;
  line-height:12px;
  font-size:9px;
  padding:0 7px;
 }

 .wedo .head{min-height:0}
}

@media(max-width:1150px) and (min-width:701px){
 .page{max-width:100%;padding:16px 18px}
 .boards{gap:16px}
 .idek .head,.idek .team{
  grid-template-columns:60px 85px minmax(130px,1fr) 120px 120px;
 }
 .idek .team>.rd.best{padding:9px 3px 3px}
}

@media(prefers-reduced-motion:reduce){
 .dot{animation:none}
}

html{scrollbar-width:none}
html::-webkit-scrollbar,
body::-webkit-scrollbar{display:none}

</style>
</head>

<body>

<header class="topbar">
 <div class="brand">
  <!-- ใส่ค่า src Base64 ของโลโก้เดิมตรงนี้ -->
  <img class="logo" src="" alt="GO Robot"
       onerror="this.style.display='none'">
  <div>
   <h1>GO ROBOT CHALLENGE 2026</h1>
   <p>ตารางคะแนนสด รุ่น WEDO และ iDekTep</p>
  </div>
 </div>

 <div class="right">
  <div class="live">
   <span class="dot"></span>
   <b class="live-tag">LIVE</b>
   <span id="updateTime"></span>
  </div>
  <button class="fs" onclick="toggleFullscreen()" title="เต็มจอ">⛶</button>
 </div>
</header>

<div class="stripe"></div>

<div class="page">
 <main class="boards">

  <section class="board idek">
   <div class="board-title">
    <h2>iDekTep</h2>
    <span>ตารางคะแนน</span>
   </div>

   <div class="head">
    <div>อันดับ</div>
    <div>ทีม</div>
    <div>สมาชิก</div>
    <div class="c">รอบ 1<small>คะแนน / เวลา</small></div>
    <div class="c">รอบ 2<small>คะแนน / เวลา</small></div>
   </div>

   <div id="idektepData">
    <div class="loading">กำลังโหลดข้อมูล iDEKTEP...</div>
   </div>
  </section>

  <section class="board wedo">
   <div class="board-title">
    <h2>WEDO</h2>
    <span>ตารางคะแนน</span>
   </div>

   <div class="head">
    <div>อันดับ</div>
    <div>ทีม</div>
    <div>สมาชิก</div>
    <div class="r">คะแนน</div>
   </div>

   <div id="wedoData">
    <div class="loading">กำลังโหลดข้อมูล WEDO...</div>
   </div>
  </section>

 </main>
</div>

<script>

const IDEKTEP_API_URL =
"https://script.google.com/macros/s/AKfycbwEKF6Pabk1pbEYdihWp1ouxwdCpoHjikhH4Q5F7AqFX4zharAWgB6_7JOME9H1KhDJIQ/exec";

const WEDO_API_URL =
"https://script.google.com/macros/s/AKfycbzLrGq-lSyBgOlyqXDPlSHn_m0iW4PAWVr-DaGfDKY9iIWPL2hbkNP2gYb4CkoU-ZFndw/exec";

const num=v=>{
 const n=parseFloat(String(v??'').replace(/,/g,''));
 return Number.isFinite(n)?n:NaN;
};

const toSec=v=>{
 const p=String(v??'').split(':').map(parseFloat);
 return p.some(x=>!Number.isFinite(x))
 ?Infinity
 :p.reduce((a,x)=>a*60+x,0);
};

const cmp=(x,y)=>x===y?0:x-y;

const isHeaderRow=t=>
 !t||t==='TEAM'||t.includes('GO ROBOT')||t.includes('SCORE BOARD');

function escapeHtml(value){
 return String(value??'').replace(
  /[&<>'"]/g,
  ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch])
 );
}

/* WEDO */

function cleanRows(raw){
 if(!Array.isArray(raw))return [];

 return raw.map(row=>({
  team:row[1]?String(row[1]).trim():'',
  member:row[2]?String(row[2]).trim():'',
  score:row[4]?String(row[4]).trim():''
 })).filter(r=>!isHeaderRow(r.team));
}

function rankClass(rank){
 return rank<=3?`top-${rank}`:'';
}

function rowHtml(r,rank){
 return `
 <div class="team ${rankClass(rank)}">
  <div class="rank">
   <span class="rank-badge">${rank}</span>
  </div>
  <div class="team-name">${escapeHtml(r.team)||'-'}</div>
  <div class="member">${escapeHtml(r.member)||'-'}</div>
  <div class="score">${escapeHtml(r.score)||'-'}</div>
 </div>`;
}

function renderWedo(raw){
 const board=document.getElementById('wedoData');
 const rows=cleanRows(raw);

 rows.sort((a,b)=>(num(b.score)||0)-(num(a.score)||0));

 board.innerHTML=rows.length
 ?rows.map((r,i)=>rowHtml(r,i+1)).join('')
 :'<div class="loading">ไม่พบข้อมูล</div>';
}

/* iDEKTEP */

function cleanIdektep(raw){
 if(!Array.isArray(raw))return [];

 const s=v=>v!=null?String(v).trim():'';

 return raw.map(row=>({
  team:s(row[1]),
  member:s(row[2]),
  rounds:[
   {score:s(row[4]),time:s(row[5])},
   {score:s(row[6]),time:s(row[7])}
  ]
 })).filter(r=>!isHeaderRow(r.team));
}

/* คะแนนสูงสุด ถ้าเท่ากันเลือกเวลาน้อยสุด */

function bestRound(rounds){
 let best=-1;

 rounds.forEach((r,i)=>{
  const sc=num(r.score);

  if(Number.isNaN(sc))return;

  if(best<0){
   best=i;
   return;
  }

  const b=rounds[best];
  const bs=num(b.score);

  if(sc>bs||(sc===bs&&toSec(r.time)<toSec(b.time))){
   best=i;
  }
 });

 return best;
}

function idekRowHtml(r,rank){

 const cells=r.rounds.map((x,i)=>`
  <div class="rd${i===r.best?' best':''}">
   <span class="rs">${escapeHtml(x.score)||'-'}</span>
   <span class="rt">${escapeHtml(x.time)||'-'}</span>
  </div>
 `).join('');

 return `
 <div class="team ${rankClass(rank)}">
  <div class="rank">
   <span class="rank-badge">${rank}</span>
  </div>
  <div class="team-name">${escapeHtml(r.team)||'-'}</div>
  <div class="member">${escapeHtml(r.member)||'-'}</div>
  ${cells}
 </div>`;
}

function renderIdektep(raw){
 const board=document.getElementById('idektepData');

 const rows=cleanIdektep(raw).map(r=>{
  const b=bestRound(r.rounds);

  return {
   ...r,
   best:b,
   bs:b>=0?num(r.rounds[b].score):-Infinity,
   bt:b>=0?toSec(r.rounds[b].time):Infinity
  };
 });

 rows.sort((a,b)=>cmp(b.bs,a.bs)||cmp(a.bt,b.bt));

 board.innerHTML=rows.length
 ?rows.map((r,i)=>idekRowHtml(r,i+1)).join('')
 :'<div class="loading">ไม่พบข้อมูล</div>';
}

/* API */

async function fetchJson(url){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),10000);

 try{
  const res=await fetch(url,{
   cache:'no-store',
   signal:controller.signal
  });

  if(!res.ok)throw new Error(`HTTP ${res.status}`);

  const data=await res.json();

  if(!data.success){
   throw new Error(data.error||'API error');
  }

  return data;
 }finally{
  clearTimeout(timeout);
 }
}

let isLoading=false;
let hasIdektepData=false;
let hasWedoData=false;

async function loadAll(){
 if(isLoading)return;

 isLoading=true;

 try{
  const results=await Promise.allSettled([
   fetchJson(IDEKTEP_API_URL),
   fetchJson(WEDO_API_URL)
  ]);

  if(results[0].status==='fulfilled'){
   renderIdektep(results[0].value.standings);
   hasIdektepData=true;
  }else{
   console.warn('iDEKTEP API ERROR:',results[0].reason);

   if(!hasIdektepData){
    document.getElementById('idektepData').innerHTML=
    '<div class="loading">กำลังเชื่อมต่อ iDEKTEP...</div>';
   }
  }

  if(results[1].status==='fulfilled'){
   renderWedo(results[1].value.standings);
   hasWedoData=true;
  }else{
   console.warn('WEDO API ERROR:',results[1].reason);

   if(!hasWedoData){
    document.getElementById('wedoData').innerHTML=
    '<div class="loading">กำลังเชื่อมต่อ WEDO...</div>';
   }
  }

  document.getElementById('updateTime').textContent=
  'อัปเดต '+new Date().toLocaleTimeString('th-TH');

 }catch(error){
  console.error('LOAD ERROR:',error);
 }finally{
  isLoading=false;
  setTimeout(loadAll,5000);
 }
}

 }else if(document.exitFullscreen){

 }
}

loadAll();
